<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 155" width="100%" height="155">
  <!-- Main Container (GitHub Dark Native style) -->
  <rect width="780" height="155" rx="10" fill="#0d1117" stroke="#30363d" stroke-width="1" />
  <line x1="370" y1="20" x2="370" y2="135" stroke="#21262d" stroke-width="1" />

  <!-- Left Column: Activity Overview -->
  <g transform="translate(26, 28)">
    <circle cx="6" cy="6" r="4" fill="#3fb950">
      <animate attributeName="opacity" values="1;0.35;1" dur="2.4s" repeatCount="indefinite" />
    </circle>
    <text x="18" y="10" fill="#e6edf3" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="13" font-weight="600">
      Resumo de Engenharia &amp; Atividade
    </text>

    <!-- Metric 1 -->
    <text x="0" y="42" fill="#7d8590" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="12">
      Contribuições (últimos 12 meses)
    </text>
    <text x="315" y="42" text-anchor="end" fill="#3fb950" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="13" font-weight="700">
      1.060
    </text>

    <!-- Metric 2 -->
    <text x="0" y="68" fill="#7d8590" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="12">
      Repositórios (públicos e privados)
    </text>
    <text x="315" y="68" text-anchor="end" fill="#e6edf3" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="13" font-weight="700">
      42
    </text>

    <!-- Metric 3 -->
    <text x="0" y="94" fill="#7d8590" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="12">
      Foco principal
    </text>
    <text x="315" y="94" text-anchor="end" fill="#58a6ff" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="600">
      Web · ERP/TOTVS · Dados
    </text>
  </g>

  <!-- Right Column: Language Distribution Bar + Legend -->
  <g transform="translate(396, 28)">
    <text x="0" y="10" fill="#e6edf3" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="13" font-weight="600">
      Principais linguagens nos projetos
    </text>

    <!-- Multi-segment GitHub-style language bar -->
    <rect x="0" y="26" width="356" height="10" rx="5" fill="#161b22" />
    <!-- TypeScript -->
    <rect x="0" y="26" width="178" height="10" rx="4" fill="#3178c6">
      <animate attributeName="width" from="0" to="178" dur="1s" fill="freeze" />
    </rect>
    <!-- JavaScript / Node -->
    <rect x="180" y="26" width="88" height="10" fill="#f1e05a">
      <animate attributeName="width" from="0" to="88" dur="1.1s" fill="freeze" />
    </rect>
    <!-- SQL / PL-SQL -->
    <rect x="270" y="26" width="50" height="10" fill="#e38c00">
      <animate attributeName="width" from="0" to="50" dur="1.2s" fill="freeze" />
    </rect>
    <!-- Python -->
    <rect x="322" y="26" width="34" height="10" rx="3" fill="#3572A5">
      <animate attributeName="width" from="0" to="34" dur="1.3s" fill="freeze" />
    </rect>

    <!-- Legend Row 1 -->
    <circle cx="6" cy="58" r="4.5" fill="#3178c6" />
    <text x="16" y="62" fill="#e6edf3" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="12" font-weight="500">TypeScript</text>
    <text x="84" y="62" fill="#7d8590" font-family="ui-monospace, Consolas, monospace" font-size="11.5">50%</text>

    <circle cx="186" cy="58" r="4.5" fill="#f1e05a" />
    <text x="196" y="62" fill="#e6edf3" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="12" font-weight="500">JavaScript / Node</text>
    <text x="304" y="62" fill="#7d8590" font-family="ui-monospace, Consolas, monospace" font-size="11.5">25%</text>

    <!-- Legend Row 2 -->
    <circle cx="6" cy="88" r="4.5" fill="#e38c00" />
    <text x="16" y="92" fill="#e6edf3" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="12" font-weight="500">SQL (Server / Postgres)</text>
    <text x="150" y="92" fill="#7d8590" font-family="ui-monospace, Consolas, monospace" font-size="11.5">15%</text>

    <circle cx="186" cy="88" r="4.5" fill="#3572A5" />
    <text x="196" y="92" fill="#e6edf3" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="12" font-weight="500">Python</text>
    <text x="245" y="92" fill="#7d8590" font-family="ui-monospace, Consolas, monospace" font-size="11.5">10%</text>
  </g>
</svg>
