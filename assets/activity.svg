<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 285" width="100%" height="285">
  <defs>
    <linearGradient id="areaGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3fb950" stop-opacity="0.32" />
      <stop offset="100%" stop-color="#3fb950" stop-opacity="0.0" />
    </linearGradient>
  </defs>

  <!-- Main Container -->
  <rect width="780" height="285" rx="10" fill="#0d1117" stroke="#30363d" stroke-width="1" />
  <line x1="370" y1="20" x2="370" y2="138" stroke="#21262d" stroke-width="1" />
  <line x1="26" y1="152" x2="754" y2="152" stroke="#21262d" stroke-width="1" />

  <!-- Top Left: Activity Overview -->
  <g transform="translate(26, 26)">
    <circle cx="6" cy="6" r="4" fill="#3fb950">
      <animate attributeName="opacity" values="1;0.3;1" dur="2.4s" repeatCount="indefinite" />
    </circle>
    <text x="18" y="10" fill="#e6edf3" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="13" font-weight="600">
      Resumo de Engenharia &amp; Atividade
    </text>

    <text x="0" y="38" fill="#7d8590" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="12">
      Contribuições (últimos 12 meses)
    </text>
    <text x="315" y="38" text-anchor="end" fill="#3fb950" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="13" font-weight="700">
      1.060
    </text>

    <text x="0" y="62" fill="#7d8590" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="12">
      Repositórios &amp; Pull Requests mesclados
    </text>
    <text x="315" y="62" text-anchor="end" fill="#e6edf3" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12.5" font-weight="700">
      42 repos · 40+ PRs
    </text>

    <text x="0" y="86" fill="#7d8590" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="12">
      Certificações técnicas verificadas
    </text>
    <text x="315" y="86" text-anchor="end" fill="#a5d6ff" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="600">
      16 (TOTVS · FIAP · EBAC · DIO)
    </text>

    <text x="0" y="110" fill="#7d8590" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="12">
      Foco principal
    </text>
    <text x="315" y="110" text-anchor="end" fill="#58a6ff" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="600">
      Web · ERP/TOTVS · Dados
    </text>
  </g>

  <!-- Top Right: Language Distribution Bar + Legend -->
  <g transform="translate(396, 26)">
    <text x="0" y="10" fill="#e6edf3" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="13" font-weight="600">
      Principais linguagens nos projetos
    </text>

    <rect x="0" y="26" width="356" height="10" rx="5" fill="#161b22" />
    <rect x="0" y="26" width="178" height="10" rx="4" fill="#3178c6">
      <animate attributeName="width" from="0" to="178" dur="1s" fill="freeze" />
    </rect>
    <rect x="180" y="26" width="88" height="10" fill="#f1e05a">
      <animate attributeName="width" from="0" to="88" dur="1.1s" fill="freeze" />
    </rect>
    <rect x="270" y="26" width="50" height="10" fill="#e38c00">
      <animate attributeName="width" from="0" to="50" dur="1.2s" fill="freeze" />
    </rect>
    <rect x="322" y="26" width="34" height="10" rx="3" fill="#3572A5">
      <animate attributeName="width" from="0" to="34" dur="1.3s" fill="freeze" />
    </rect>

    <circle cx="6" cy="58" r="4.5" fill="#3178c6" />
    <text x="16" y="62" fill="#e6edf3" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="12" font-weight="500">TypeScript</text>
    <text x="84" y="62" fill="#7d8590" font-family="ui-monospace, Consolas, monospace" font-size="11.5">50%</text>

    <circle cx="186" cy="58" r="4.5" fill="#f1e05a" />
    <text x="196" y="62" fill="#e6edf3" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="12" font-weight="500">JavaScript / Node</text>
    <text x="304" y="62" fill="#7d8590" font-family="ui-monospace, Consolas, monospace" font-size="11.5">25%</text>

    <circle cx="6" cy="88" r="4.5" fill="#e38c00" />
    <text x="16" y="92" fill="#e6edf3" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="12" font-weight="500">SQL (Server / Postgres)</text>
    <text x="150" y="92" fill="#7d8590" font-family="ui-monospace, Consolas, monospace" font-size="11.5">15%</text>

    <circle cx="186" cy="88" r="4.5" fill="#3572A5" />
    <text x="196" y="92" fill="#e6edf3" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="12" font-weight="500">Python</text>
    <text x="245" y="92" fill="#7d8590" font-family="ui-monospace, Consolas, monospace" font-size="11.5">10%</text>
  </g>

  <!-- Bottom Row: Monthly Commit Evolution Chart (Real 2026 Data) -->
  <g transform="translate(26, 172)">
    <text x="0" y="10" fill="#e6edf3" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="12.5" font-weight="600">
      Evolução Mensal de Contribuições (2º Semestre)
    </text>
    <text x="728" y="10" text-anchor="end" fill="#7d8590" font-family="ui-monospace, Consolas, monospace" font-size="11">
      Pico mensal: 306 contribuições (Nov)
    </text>

    <!-- Horizontal Grid Lines -->
    <line x1="0" y1="30" x2="728" y2="30" stroke="#161b22" stroke-width="1" />
    <line x1="0" y1="58" x2="728" y2="58" stroke="#161b22" stroke-width="1" />
    <line x1="0" y1="86" x2="728" y2="86" stroke="#21262d" stroke-width="1" />

    <!-- Area & Line (Jun:0 -> Jul:90 -> Ago:244 -> Set:299 -> Out:118 -> Nov:306) -->
    <!-- Coordinates: x = 30, 164, 298, 432, 566, 700; y = 86 (0), 69 (90), 40 (244), 30 (299), 64 (118), 28 (306) -->
    <path d="M 30 86 L 164 69 L 298 40 L 432 30 L 566 64 L 700 28 L 700 86 Z" fill="url(#areaGrad)" />
    <path d="M 30 86 L 164 69 L 298 40 L 432 30 L 566 64 L 700 28" fill="none" stroke="#3fb950" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Data Points & Labels -->
    <!-- Jun -->
    <circle cx="30" cy="86" r="3.5" fill="#161b22" stroke="#3fb950" stroke-width="2" />
    <text x="30" y="102" text-anchor="middle" fill="#7d8590" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="10.5">Jun</text>

    <!-- Jul (90) -->
    <circle cx="164" cy="69" r="3.5" fill="#0d1117" stroke="#3fb950" stroke-width="2" />
    <text x="164" y="61" text-anchor="middle" fill="#7d8590" font-family="ui-monospace, Consolas, monospace" font-size="10">90</text>
    <text x="164" y="102" text-anchor="middle" fill="#7d8590" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="10.5">Jul</text>

    <!-- Ago (244) -->
    <circle cx="298" cy="40" r="3.5" fill="#0d1117" stroke="#3fb950" stroke-width="2" />
    <text x="298" y="32" text-anchor="middle" fill="#e6edf3" font-family="ui-monospace, Consolas, monospace" font-size="10">244</text>
    <text x="298" y="102" text-anchor="middle" fill="#7d8590" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="10.5">Ago</text>

    <!-- Set (299) -->
    <circle cx="432" cy="30" r="3.5" fill="#0d1117" stroke="#3fb950" stroke-width="2" />
    <text x="432" y="22" text-anchor="middle" fill="#e6edf3" font-family="ui-monospace, Consolas, monospace" font-size="10" font-weight="600">299</text>
    <text x="432" y="102" text-anchor="middle" fill="#7d8590" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="10.5">Set</text>

    <!-- Out (118) -->
    <circle cx="566" cy="64" r="3.5" fill="#0d1117" stroke="#3fb950" stroke-width="2" />
    <text x="566" y="56" text-anchor="middle" fill="#7d8590" font-family="ui-monospace, Consolas, monospace" font-size="10">118</text>
    <text x="566" y="102" text-anchor="middle" fill="#7d8590" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="10.5">Out</text>

    <!-- Nov (306 - Active Pulsing Node) -->
    <circle cx="700" cy="28" r="7" fill="#3fb950" fill-opacity="0.25">
      <animate attributeName="r" values="4;9;4" dur="2s" repeatCount="indefinite" />
      <animate attributeName="fill-opacity" values="0.4;0.05;0.4" dur="2s" repeatCount="indefinite" />
    </circle>
    <circle cx="700" cy="28" r="4" fill="#3fb950" />
    <text x="700" y="19" text-anchor="middle" fill="#3fb950" font-family="ui-monospace, Consolas, monospace" font-size="10.5" font-weight="700">306</text>
    <text x="700" y="102" text-anchor="middle" fill="#e6edf3" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="10.5" font-weight="600">Nov</text>
  </g>
</svg>
