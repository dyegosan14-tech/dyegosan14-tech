<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 260" width="100%" height="260">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.7" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9" />
    </linearGradient>
  </defs>

  <!-- Main Card -->
  <rect width="900" height="260" rx="16" fill="url(#bg)" stroke="#1e293b" stroke-width="2" />
  <rect x="0" y="0" width="900" height="4" rx="2" fill="url(#accent)" />

  <!-- Left Column: Identity -->
  <g transform="translate(40, 48)">
    <!-- Status Pill -->
    <rect x="0" y="0" width="275" height="26" rx="13" fill="#064e3b" fill-opacity="0.5" stroke="#10b981" stroke-width="1" />
    <circle cx="14" cy="13" r="4" fill="#34d399" />
    <text x="26" y="17" fill="#a7f3d0" font-family="Segoe UI, Inter, system-ui, sans-serif" font-size="11.5" font-weight="600">
      Disponível para projetos &amp; consultoria
    </text>

    <!-- Name & Title -->
    <text x="0" y="68" fill="#f8fafc" font-family="Segoe UI, Inter, system-ui, sans-serif" font-size="34" font-weight="800" letter-spacing="-0.5">
      Dyego Santos de Assis
    </text>
    <text x="0" y="96" fill="url(#accent)" font-family="Segoe UI, Inter, system-ui, sans-serif" font-size="14.5" font-weight="600">
      Desenvolvedor de Software · Sistemas Web, Automação &amp; IA Aplicada
    </text>

    <!-- Bio / Subtitle -->
    <text x="0" y="130" fill="#94a3b8" font-family="Segoe UI, Inter, system-ui, sans-serif" font-size="12.5">
      Da concepção arquitetural e banco de dados até a interface do usuário.
    </text>
    <text x="0" y="150" fill="#94a3b8" font-family="Segoe UI, Inter, system-ui, sans-serif" font-size="12.5">
      Foco em estabilidade, integrações corporativas (ERP/TOTVS) e produtos.
    </text>

    <!-- Location -->
    <text x="0" y="184" fill="#64748b" font-family="Consolas, JetBrains Mono, monospace" font-size="12.5">
      📍 Recife, Pernambuco - Brasil  |  @dyegosan14-tech
    </text>
  </g>

  <!-- Right Column: Terminal Window -->
  <g transform="translate(545, 36)">
    <rect width="320" height="188" rx="12" fill="url(#cardBg)" stroke="#334155" stroke-width="1.5" />
    <!-- Terminal Header -->
    <rect width="320" height="30" rx="12" fill="#0f172a" />
    <circle cx="16" cy="15" r="5" fill="#ef4444" />
    <circle cx="32" cy="15" r="5" fill="#f59e0b" />
    <circle cx="48" cy="15" r="5" fill="#10b981" />
    <text x="160" y="19" text-anchor="middle" fill="#64748b" font-family="Consolas, monospace" font-size="11">
      dyego@dev:~
    </text>

    <!-- Terminal Lines -->
    <text x="16" y="54" fill="#38bdf8" font-family="Consolas, monospace" font-size="12" font-weight="700">
      $ whoami
    </text>
    <text x="16" y="72" fill="#e2e8f0" font-family="Consolas, monospace" font-size="11.5">
      dyego_santos (Full-Stack &amp; DevOps)
    </text>

    <text x="16" y="98" fill="#38bdf8" font-family="Consolas, monospace" font-size="12" font-weight="700">
      $ stack --top
    </text>
    <text x="16" y="116" fill="#a7f3d0" font-family="Consolas, monospace" font-size="11.5">
      TS · React · Node.js · SQL · Docker
    </text>

    <text x="16" y="142" fill="#38bdf8" font-family="Consolas, monospace" font-size="12" font-weight="700">
      $ cat focus.txt
    </text>
    <text x="16" y="160" fill="#c4b5fd" font-family="Consolas, monospace" font-size="11.5">
      saas + ai_agents + erp_automation
    </text>
  </g>
</svg>
