<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 185" width="100%" height="185">
  <defs>
    <linearGradient id="bgCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#0b0f19" />
    </linearGradient>
    <linearGradient id="bar1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
    <linearGradient id="bar2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <linearGradient id="bar3" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a78bfa" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
  </defs>

  <!-- Left Card: Áreas de Especialidade -->
  <g transform="translate(0, 5)">
    <rect width="440" height="175" rx="14" fill="url(#bgCard)" stroke="#1e293b" stroke-width="1.5" />
    <text x="24" y="34" fill="#f8fafc" font-family="Segoe UI, Inter, sans-serif" font-size="15" font-weight="700">
      ⚡ Foco de Engenharia &amp; Arquitetura
    </text>

    <text x="24" y="66" fill="#cbd5e1" font-family="Segoe UI, sans-serif" font-size="12.5" font-weight="600">
      01. Sistemas Web, Portais Corporativos &amp; APIs REST
    </text>
    <text x="24" y="84" fill="#64748b" font-family="Segoe UI, sans-serif" font-size="11.5">
      Aplicações escaláveis em React, Next.js, TypeScript e Node.js
    </text>

    <text x="24" y="112" fill="#cbd5e1" font-family="Segoe UI, sans-serif" font-size="12.5" font-weight="600">
      02. Automação &amp; Integrações Corporativas (ERP / TOTVS)
    </text>
    <text x="24" y="130" fill="#64748b" font-family="Segoe UI, sans-serif" font-size="11.5">
      Integração com TOTVS/RM, Active Directory, SQL Server e pipelines
    </text>

    <text x="24" y="156" fill="#cbd5e1" font-family="Segoe UI, sans-serif" font-size="12.5" font-weight="600">
      03. IA Aplicada, Agentes Autônomos &amp; Analytics
    </text>
  </g>

  <!-- Right Card: Distribuição da Stack -->
  <g transform="translate(460, 5)">
    <rect width="440" height="175" rx="14" fill="url(#bgCard)" stroke="#1e293b" stroke-width="1.5" />
    <text x="24" y="34" fill="#f8fafc" font-family="Segoe UI, Inter, sans-serif" font-size="15" font-weight="700">
      📊 Principais Tecnologias nos Repositórios
    </text>

    <!-- TypeScript / React / Next.js -->
    <text x="24" y="64" fill="#e2e8f0" font-family="Segoe UI, sans-serif" font-size="12" font-weight="600">TypeScript · React · Next.js</text>
    <text x="416" y="64" text-anchor="end" fill="#38bdf8" font-family="Consolas, monospace" font-size="12" font-weight="700">48%</text>
    <rect x="24" y="72" width="392" height="8" rx="4" fill="#1e293b" />
    <rect x="24" y="72" width="310" height="8" rx="4" fill="url(#bar1)" />

    <!-- Node.js / APIs / SQL -->
    <text x="24" y="104" fill="#e2e8f0" font-family="Segoe UI, sans-serif" font-size="12" font-weight="600">Node.js · SQL Server · PostgreSQL</text>
    <text x="416" y="104" text-anchor="end" fill="#34d399" font-family="Consolas, monospace" font-size="12" font-weight="700">32%</text>
    <rect x="24" y="112" width="392" height="8" rx="4" fill="#1e293b" />
    <rect x="24" y="112" width="240" height="8" rx="4" fill="url(#bar2)" />

    <!-- Python / IA / DevOps -->
    <text x="24" y="144" fill="#e2e8f0" font-family="Segoe UI, sans-serif" font-size="12" font-weight="600">Python · IA Generativa · Docker &amp; Linux</text>
    <text x="416" y="144" text-anchor="end" fill="#a78bfa" font-family="Consolas, monospace" font-size="12" font-weight="700">20%</text>
    <rect x="24" y="152" width="392" height="8" rx="4" fill="#1e293b" />
    <rect x="24" y="152" width="165" height="8" rx="4" fill="url(#bar3)" />
  </g>
</svg>
