<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 118" width="100%" height="118">
  <rect width="780" height="118" rx="10" fill="#0d1117" stroke="#30363d" stroke-width="1" />
  <!-- Window Header -->
  <rect width="780" height="28" rx="10" fill="#161b22" />
  <rect y="18" width="780" height="10" fill="#161b22" />
  <line x1="0" y1="28" x2="780" y2="28" stroke="#30363d" stroke-width="1" />
  <circle cx="18" cy="14" r="5" fill="#ff5f56" />
  <circle cx="34" cy="14" r="5" fill="#ffbd2e" />
  <circle cx="50" cy="14" r="5" fill="#27c93f" />
  <text x="390" y="18" text-anchor="middle" fill="#7d8590" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11">
    dyego@recife: ~/workspace
  </text>

  <!-- Terminal Content -->
  <g font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12">
    <text x="20" y="52" fill="#3fb950" font-weight="700">➜</text>
    <text x="36" y="52" fill="#58a6ff" font-weight="600">whoami</text>
    <text x="95" y="52" fill="#e6edf3">Dyego Santos · Desenvolvedor de Software (Recife, PE)</text>

    <text x="20" y="75" fill="#3fb950" font-weight="700">➜</text>
    <text x="36" y="75" fill="#58a6ff" font-weight="600">stack</text>
    <text x="95" y="75" fill="#7d8590">TypeScript · React · Next.js · Node.js · Python · SQL Server · PostgreSQL · Docker</text>

    <text x="20" y="98" fill="#3fb950" font-weight="700">➜</text>
    <text x="36" y="98" fill="#58a6ff" font-weight="600">focus</text>
    <text x="95" y="98" fill="#a5d6ff">Sistemas Web, Automação Empresarial, Integrações ERP/TOTVS &amp; IA Aplicada</text>

    <!-- Blinking Cursor -->
    <rect x="622" y="87" width="7" height="14" fill="#3fb950">
      <animate attributeName="opacity" values="1;0;1" dur="1.1s" repeatCount="indefinite" />
    </rect>
  </g>
</svg>
