<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 175" width="100%" height="175">
  <defs>
    <linearGradient id="card" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#111827" />
      <stop offset="100%" stop-color="#0b0f19" />
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="purple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a78bfa" />
      <stop offset="100%" stop-color="#7c3aed" />
    </linearGradient>
    <linearGradient id="emerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
  </defs>

  <!-- Trophy 1: Pull Shark -->
  <g transform="translate(0, 5)">
    <rect width="140" height="160" rx="12" fill="url(#card)" stroke="#1e293b" stroke-width="1.5" />
    <rect x="0" y="0" width="140" height="3" rx="1.5" fill="url(#cyan)" />
    <text x="70" y="26" text-anchor="middle" fill="#38bdf8" font-family="Segoe UI, sans-serif" font-size="11" font-weight="700">PULL SHARK</text>
    <circle cx="70" cy="74" r="28" fill="#0c4a6e" fill-opacity="0.4" stroke="#38bdf8" stroke-width="1.5" />
    <text x="70" y="83" text-anchor="middle" font-size="26">🦈</text>
    <text x="70" y="124" text-anchor="middle" fill="#f8fafc" font-family="Segoe UI, sans-serif" font-size="12" font-weight="700">PRs Merged</text>
    <text x="70" y="143" text-anchor="middle" fill="#94a3b8" font-family="Consolas, monospace" font-size="11">40+ Merged</text>
  </g>

  <!-- Trophy 2: Pair Extraordinaire -->
  <g transform="translate(152, 5)">
    <rect width="140" height="160" rx="12" fill="url(#card)" stroke="#1e293b" stroke-width="1.5" />
    <rect x="0" y="0" width="140" height="3" rx="1.5" fill="url(#purple)" />
    <text x="70" y="26" text-anchor="middle" fill="#a78bfa" font-family="Segoe UI, sans-serif" font-size="11" font-weight="700">PAIR EXTRA</text>
    <circle cx="70" cy="74" r="28" fill="#4c1d95" fill-opacity="0.4" stroke="#a78bfa" stroke-width="1.5" />
    <text x="70" y="83" text-anchor="middle" font-size="25">🤝</text>
    <text x="70" y="124" text-anchor="middle" fill="#f8fafc" font-family="Segoe UI, sans-serif" font-size="12" font-weight="700">Co-Authored</text>
    <text x="70" y="143" text-anchor="middle" fill="#94a3b8" font-family="Consolas, monospace" font-size="11">Unlocked</text>
  </g>

  <!-- Trophy 3: Quickdraw -->
  <g transform="translate(304, 5)">
    <rect width="140" height="160" rx="12" fill="url(#card)" stroke="#1e293b" stroke-width="1.5" />
    <rect x="0" y="0" width="140" height="3" rx="1.5" fill="url(#gold)" />
    <text x="70" y="26" text-anchor="middle" fill="#fbbf24" font-family="Segoe UI, sans-serif" font-size="11" font-weight="700">QUICKDRAW</text>
    <circle cx="70" cy="74" r="28" fill="#78350f" fill-opacity="0.4" stroke="#fbbf24" stroke-width="1.5" />
    <text x="70" y="83" text-anchor="middle" font-size="25">⚡</text>
    <text x="70" y="124" text-anchor="middle" fill="#f8fafc" font-family="Segoe UI, sans-serif" font-size="12" font-weight="700">Fast Resolver</text>
    <text x="70" y="143" text-anchor="middle" fill="#94a3b8" font-family="Consolas, monospace" font-size="11">&lt; 5 min SLA</text>
  </g>

  <!-- Trophy 4: YOLO -->
  <g transform="translate(456, 5)">
    <rect width="140" height="160" rx="12" fill="url(#card)" stroke="#1e293b" stroke-width="1.5" />
    <rect x="0" y="0" width="140" height="3" rx="1.5" fill="url(#emerald)" />
    <text x="70" y="26" text-anchor="middle" fill="#34d399" font-family="Segoe UI, sans-serif" font-size="11" font-weight="700">YOLO BADGE</text>
    <circle cx="70" cy="74" r="28" fill="#064e3b" fill-opacity="0.4" stroke="#34d399" stroke-width="1.5" />
    <text x="70" y="83" text-anchor="middle" font-size="25">🚀</text>
    <text x="70" y="124" text-anchor="middle" fill="#f8fafc" font-family="Segoe UI, sans-serif" font-size="12" font-weight="700">Direct Ship</text>
    <text x="70" y="143" text-anchor="middle" fill="#94a3b8" font-family="Consolas, monospace" font-size="11">100% Unlocked</text>
  </g>

  <!-- Trophy 5: Developer Program -->
  <g transform="translate(608, 5)">
    <rect width="140" height="160" rx="12" fill="url(#card)" stroke="#1e293b" stroke-width="1.5" />
    <rect x="0" y="0" width="140" height="3" rx="1.5" fill="url(#cyan)" />
    <text x="70" y="26" text-anchor="middle" fill="#38bdf8" font-family="Segoe UI, sans-serif" font-size="11" font-weight="700">DEV PROGRAM</text>
    <circle cx="70" cy="74" r="28" fill="#0c4a6e" fill-opacity="0.4" stroke="#38bdf8" stroke-width="1.5" />
    <text x="70" y="83" text-anchor="middle" font-size="24">🛠️</text>
    <text x="70" y="124" text-anchor="middle" fill="#f8fafc" font-family="Segoe UI, sans-serif" font-size="12" font-weight="700">GitHub Member</text>
    <text x="70" y="143" text-anchor="middle" fill="#94a3b8" font-family="Consolas, monospace" font-size="11">Official Badge</text>
  </g>

  <!-- Trophy 6: Repositories -->
  <g transform="translate(760, 5)">
    <rect width="140" height="160" rx="12" fill="url(#card)" stroke="#1e293b" stroke-width="1.5" />
    <rect x="0" y="0" width="140" height="3" rx="1.5" fill="url(#gold)" />
    <text x="70" y="26" text-anchor="middle" fill="#fbbf24" font-family="Segoe UI, sans-serif" font-size="11" font-weight="700">REPOSITORIES</text>
    <circle cx="70" cy="74" r="28" fill="#78350f" fill-opacity="0.4" stroke="#fbbf24" stroke-width="1.5" />
    <text x="70" y="83" text-anchor="middle" font-size="25">🏆</text>
    <text x="70" y="124" text-anchor="middle" fill="#f8fafc" font-family="Segoe UI, sans-serif" font-size="12" font-weight="700">40+ Projetos</text>
    <text x="70" y="143" text-anchor="middle" fill="#94a3b8" font-family="Consolas, monospace" font-size="11">Full-Stack &amp; IA</text>
  </g>
</svg>
